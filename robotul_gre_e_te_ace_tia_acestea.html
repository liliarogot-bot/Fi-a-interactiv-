<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robotul Greșește - Aceștia/Acestea</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Quicksand:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Quicksand', sans-serif;
            background-color: #f0f9ff;
        }
        h1, .robot-font {
            font-family: 'Fredoka One', cursive;
        }
        .robot-card {
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            border-radius: 20px;
            background: white;
            transition: transform 0.3s ease;
        }
        .btn-option {
            transition: all 0.2s;
            border-bottom: 4px solid #cbd5e1;
        }
        .btn-option:active {
            transform: translateY(4px);
            border-bottom: 0;
        }
        .robot-eye {
            animation: blink 3s infinite;
        }
        @keyframes blink {
            0%, 90%, 100% { height: 15px; }
            95% { height: 2px; }
        }
    </style>
</head>
<body class="p-4 md:p-8">

<div class="max-w-2xl mx-auto">
    <!-- Header -->
    <div class="text-center mb-8">
        <h1 class="text-4xl text-blue-600 mb-2">🤖 Robotul Robo-Gafă</h1>
        <p class="text-lg text-gray-600">Ajută-l pe robot să vorbească corect! El mereu încurcă cuvintele.</p>
        <div class="mt-4 p-2 bg-yellow-100 rounded-lg border-2 border-yellow-300 text-sm">
            💡 <strong>Regulă:</strong> Aceștia (Masc. Pl. - Эти) | Acestea (Fem. Pl. - Эти)
        </div>
    </div>

    <!-- Game Container -->
    <div id="game-container" class="robot-card p-6 border-4 border-blue-200">
        <div class="flex flex-col items-center">
            <!-- Robot Character -->
            <div class="w-32 h-32 bg-gray-200 rounded-t-3xl relative border-4 border-gray-400 mb-6 flex flex-col items-center justify-center">
                <div class="flex gap-4">
                    <div class="w-4 h-4 bg-red-500 rounded-full robot-eye"></div>
                    <div class="w-4 h-4 bg-red-500 rounded-full robot-eye"></div>
                </div>
                <div class="w-16 h-2 bg-gray-400 mt-4 rounded-full"></div>
            </div>

            <!-- Speech Bubble -->
            <div class="relative bg-white border-4 border-red-400 p-6 rounded-2xl mb-8 w-full text-center">
                <div class="absolute -top-4 left-1/2 -translate-x-1/2 bg-red-500 text-white px-3 py-1 rounded-full text-xs font-bold uppercase">Robotul spune greșit:</div>
                <p id="wrong-sentence" class="text-2xl text-red-600 font-bold mb-2 italic">Acestea sunt băieții.</p>
                <p id="russian-translation" class="text-gray-500 italic">(Это мальчики)</p>
            </div>

            <!-- Task -->
            <div class="text-center mb-6">
                <p class="text-xl font-bold text-gray-700">Cum este corect? <span class="text-blue-500">Repară-l!</span></p>
                <p class="text-sm text-gray-400">(Как правильно? Исправь его!)</p>
            </div>

            <!-- Options -->
            <div class="grid grid-cols-2 gap-4 w-full">
                <button onclick="checkAnswer('Aceștia')" class="btn-option bg-blue-500 hover:bg-blue-600 text-white py-4 rounded-xl text-xl font-bold">Aceștia</button>
                <button onclick="checkAnswer('Acestea')" class="btn-option bg-pink-500 hover:bg-pink-600 text-white py-4 rounded-xl text-xl font-bold">Acestea</button>
            </div>
            
            <div id="feedback" class="mt-6 text-center h-12 text-lg font-bold"></div>
        </div>
    </div>

    <!-- Score/Progress -->
    <div class="mt-8 flex justify-between items-center bg-white p-4 rounded-xl border-2 border-blue-100">
        <div>
            <span class="text-gray-500">Nivel:</span>
            <span id="current-level" class="font-bold text-blue-600">1/8</span>
        </div>
        <div id="score" class="font-bold text-green-600">Reparații: 0</div>
        <button onclick="resetGame()" class="text-xs text-gray-400 underline uppercase tracking-widest">Restart</button>
    </div>
</div>

<script>
    const levels = [
        { wrong: "Acestea sunt băieții.", correct: "Aceștia", russian: "Это мальчики", noun: "băieții (M)" },
        { wrong: "Aceștia sunt fetele.", correct: "Acestea", russian: "Это девочки", noun: "fetele (F)" },
        { wrong: "Acestea sunt câinii.", correct: "Aceștia", russian: "Это собаки", noun: "câinii (M)" },
        { wrong: "Aceștia sunt florile.", correct: "Acestea", russian: "Acestea", russian: "Это цветы", noun: "florile (F)" },
        { wrong: "Acestea sunt părinții.", correct: "Aceștia", russian: "Это родители", noun: "părinții (M)" },
        { wrong: "Aceștia sunt mașinile.", correct: "Acestea", russian: "Это машины", noun: "mașinile (F)" },
        { wrong: "Acestea sunt frații.", correct: "Aceștia", russian: "Это братья", noun: "frații (M)" },
        { wrong: "Aceștia sunt merele.", correct: "Acestea", russian: "Это яблоки", noun: "merele (F/N)" }
    ];

    let currentLevelIndex = 0;
    let score = 0;

    function loadLevel() {
        const level = levels[currentLevelIndex];
        document.getElementById('wrong-sentence').innerText = level.wrong;
        document.getElementById('russian-translation').innerText = `(${level.russian})`;
        document.getElementById('current-level').innerText = `${currentLevelIndex + 1}/${levels.length}`;
        document.getElementById('feedback').innerText = "";
        document.getElementById('feedback').className = "mt-6 text-center h-12 text-lg font-bold";
    }

    function checkAnswer(choice) {
        const level = levels[currentLevelIndex];
        const feedback = document.getElementById('feedback');
        
        if (choice === level.correct) {
            score++;
            document.getElementById('score').innerText = `Reparații: ${score}`;
            feedback.innerText = "✅ Bravo! Robotul a fost reparat!";
            feedback.className = "mt-6 text-center h-12 text-lg font-bold text-green-600 animate-bounce";
            
            setTimeout(() => {
                nextLevel();
            }, 1500);
        } else {
            feedback.innerText = `❌ Oops! Robotul scoate fum! Gândește-te la ${level.noun}.`;
            feedback.className = "mt-6 text-center h-12 text-lg font-bold text-red-500 animate-pulse";
        }
    }

    function nextLevel() {
        currentLevelIndex++;
        if (currentLevelIndex < levels.length) {
            loadLevel();
        } else {
            document.getElementById('game-container').innerHTML = `
                <div class="text-center p-8">
                    <h2 class="text-4xl mb-4">🏆 Felicitări!</h2>
                    <p class="text-xl mb-6">Ai reparat robotul Robo-Gafă complet!</p>
                    <div class="text-6xl mb-6">🛠️🤖✨</div>
                    <p class="text-gray-500 mb-6">Scor final: ${score}/${levels.length}</p>
                    <button onclick="location.reload()" class="bg-blue-600 text-white px-8 py-3 rounded-full font-bold shadow-lg">Mai joc o dată</button>
                </div>
            `;
        }
    }

    function resetGame() {
        currentLevelIndex = 0;
        score = 0;
        document.getElementById('score').innerText = `Reparații: 0`;
        loadLevel();
    }

    // Start
    loadLevel();
</script>

</body>
</html>
